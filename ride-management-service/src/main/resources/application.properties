spring.application.name=ride-management-service
server.port=5003
spring.config.import=optional:file:.env[.properties]

# Use a service-specific URI so this service cannot accidentally share another service's database.
spring.data.mongodb.uri=${RIDE_MONGO_URI:mongodb://localhost:27017/ridelink_ride_db}

# Springdoc OpenAPI (Swagger UI) Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs